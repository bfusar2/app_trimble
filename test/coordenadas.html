<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8" /><title>Testes – Coordenadas CSV</title>
<style>body{font:14px system-ui;padding:16px;background:#fff;color:#222}.ok{color:#1e8a44}.falha{color:#c81922;font-weight:600}</style></head>
<body>
  <h1>Testes – Coordenadas CSV</h1>
  <p id="resumo"></p>
  <ul id="out"></ul>
  <script type="module">
    import { buildCsv, parseCsv, parseNumber, midpoint, distance, nextPointNumber, csvFileName, splitCsvLine, lineIntersection } from "../coordenadas/points.js";
    import { fromBasePoint, fitControlPoints, toGlobal, toLocal, looksGlobal } from "../coordenadas/geo.js";
    import { readMarkedPoints, markedPointLayers, sessionKey } from "../coordenadas/marked.js";
    import { makeSectionPlane } from "../section.js";
    import { buildDxf } from "../dxf.js";

    const results = [];
    const check = (nome, cond, detalhe = "") => results.push({ nome, ok: !!cond, detalhe });
    const near = (a, b, tol = 1e-9) => Math.abs(a - b) <= tol;

    // ---------- números ----------
    check("Número com vírgula decimal", parseNumber("734810,41") === 734810.41);
    check("Número com ponto decimal", parseNumber("734810.41") === 734810.41);
    check("Milhar brasileiro", parseNumber("7.527.201,64") === 7527201.64);
    check("Milhar internacional", parseNumber("7,527,201.64") === 7527201.64);
    check("Negativo", parseNumber("-12,5") === -12.5);
    check("Inteiro", parseNumber("445") === 445);
    check("Texto não é número", Number.isNaN(parseNumber("X (m)")));
    check("Vazio não é número", Number.isNaN(parseNumber("")));
    check("Vírgulas ambíguas não são número", Number.isNaN(parseNumber("1,234,567")));

    // ---------- nomes e ponto médio ----------
    check("Próximo número vazio", nextPointNumber([]) === 1);
    check("Próximo número com lacuna", nextPointNumber(["P1", "P7", "P3"]) === 8);
    check("Próximo número ignora nomes próprios", nextPointNumber(["PV-01", "Pilar", "p2"]) === 3);
    const a = { x: 734810.41, y: 7527201.64, z: 445.95 }, b = { x: 734812.41, y: 7527205.64, z: 447.95 };
    const m = midpoint(a, b);
    check("Ponto médio", near(m.x, 734811.41, 1e-6) && near(m.y, 7527203.64, 1e-6) && near(m.z, 446.95, 1e-6), JSON.stringify(m));
    check("Distância", near(distance(a, b), Math.hypot(2, 4, 2), 1e-9));

    // ---------- CSV: exportação ----------
    const pts = [
      { name: "P1", x: 734810.41, y: 7527201.64, z: 445.95, desc: "" },
      { name: "P2", x: 734812.4106, y: 7527205.6449, z: 447.9504, desc: "Pilar C8; eixo \"A\"" },
      { name: "P3", ...m, desc: "Médio de P1 e P2" },
    ];
    const br = buildCsv(pts);
    const brLines = br.replace(/^﻿/, "").trim().split("\r\n");
    check("BR começa com BOM (acentos no Excel)", br.startsWith("﻿"));
    check("BR cabeçalho", brLines[0] === "Ponto;X (m);Y (m);Z (m);Descrição", brLines[0]);
    check("BR linha P1", brLines[1] === "P1;734810,410;7527201,640;445,950;", brLines[1]);
    check("BR arredonda em mm", brLines[2].startsWith("P2;734812,411;7527205,645;447,950;"), brLines[2]);
    check("BR protege ; e aspas na descrição", brLines[2].endsWith(';"Pilar C8; eixo ""A"""'), brLines[2]);
    const intl = buildCsv(pts, { format: "intl", header: false });
    const intlLines = intl.trim().split("\r\n");
    check("Internacional sem BOM nem cabeçalho", !intl.startsWith("﻿") && intlLines.length === 3);
    check("Internacional linha P1", intlLines[0] === "P1,734810.410,7527201.640,445.950,", intlLines[0]);
    check("Internacional mantém ; sem aspas", intlLines[1].endsWith(',"Pilar C8; eixo ""A"""'), intlLines[1]);
    check("Nome de arquivo", csvFileName(new Date(2026, 10, 16, 8, 5)) === "coordenadas_20261116_0805.csv");

    // ---------- CSV: ida e volta ----------
    for (const [nome, csv] of [["BR", br], ["internacional", intl]]) {
      const { points, skipped } = parseCsv(csv);
      const same = points.length === 3 && points.every((p, i) =>
        p.name === pts[i].name && near(p.x, +pts[i].x.toFixed(3), 1e-6) && near(p.y, +pts[i].y.toFixed(3), 1e-6) &&
        near(p.z, +pts[i].z.toFixed(3), 1e-6) && p.desc === pts[i].desc);
      check(`Ida e volta ${nome}`, same && !skipped.length, JSON.stringify(points));
    }

    // ---------- CSV: outros arquivos ----------
    const pnezd = parseCsv("Ponto,N,E,Cota,Descricao\n10,7527201.64,734810.41,445.95,MURO\n");
    check("Cabeçalho N/E troca as colunas", pnezd.points[0]?.x === 734810.41 && pnezd.points[0]?.y === 7527201.64 &&
      pnezd.points[0]?.name === "10" && pnezd.points[0]?.desc === "MURO", JSON.stringify(pnezd.points));
    const xyz = parseCsv("734810,41;7527201,64;445,95\n734811;7527202;446\n");
    check("Só X;Y;Z sem cabeçalho", xyz.points.length === 2 && xyz.points[0].name === null && xyz.points[1].z === 446, JSON.stringify(xyz.points));
    const numbered = parseCsv("1 734810.41 7527201.64 445.95\n2 734811 7527202 446 canto\n");
    check("Separado por espaços com número do ponto", numbered.points.length === 2 && numbered.points[0].name === "1" &&
      numbered.points[1].desc === "canto", JSON.stringify(numbered.points));
    const tab = parseCsv("Nome\tX\tY\tZ\nA\t1,5\t2,5\t3,5\n");
    check("Separado por tabulação", tab.points[0]?.name === "A" && tab.points[0]?.x === 1.5, JSON.stringify(tab.points));
    const bad = parseCsv("Ponto;X;Y;Z\nP1;1;2;3\nP2;abc;2;3\n\nP3;4;5;6\n");
    check("Linha inválida é listada e as demais entram", bad.points.length === 2 && bad.skipped.length === 1 && bad.skipped[0].line === 3,
      JSON.stringify(bad));
    const unknownHeader = parseCsv("Codigo do ponto;Leste;Norte;Altura\nA1;1;2;3\n");
    check("Cabeçalho desconhecido é pulado", unknownHeader.points.length === 1 && !unknownHeader.skipped.length, JSON.stringify(unknownHeader));
    check("Aspas com separador dentro", JSON.stringify(splitCsvLine('P1;"a;b";"c ""d"""', ";")) === JSON.stringify(["P1", "a;b", 'c "d"']));
    check("Arquivo vazio", parseCsv("").points.length === 0);
    const commaWithSemicolon = parseCsv('P1,1.5,2.5,3.5,"a; b"\nP2,4,5,6,c\n');
    check("Vírgula com ; na descrição", commaWithSemicolon.points.length === 2 && commaWithSemicolon.points[0].desc === "a; b",
      JSON.stringify(commaWithSemicolon));
    const brIntegers = parseCsv("P1;734810;7527201;445\nP2;734811;7527202;446\n");
    check("BR com inteiros", brIntegers.points.length === 2 && brIntegers.points[1].y === 7527202, JSON.stringify(brIntegers));

    // ---------- pontos marcados: nomes da sessão ----------
    const mm = (x, y, z) => ({ positionX: x * 1000, positionY: y * 1000, positionZ: z * 1000 });
    const fakeApi = { markup: { getSinglePointMarkups: async () => [
      { id: 12, start: mm(10, 20, 3) }, { id: 5, start: mm(1, 2, 3) }, { id: 9, start: mm(4, 5, 6) }, { id: 7 },
    ] } };
    sessionStorage.setItem(sessionKey("teste-pontos"), JSON.stringify([
      { id: 9, name: "Pilar C8", desc: "topo", x: 4, y: 5, z: 6 },
      { id: 12, name: "P4", desc: "", x: 99, y: 99, z: 99 }, // mesmo id, outra posição: não vale
    ]));
    const marked = await readMarkedPoints(fakeApi, "teste-pontos");
    sessionStorage.removeItem(sessionKey("teste-pontos"));
    check("Pontos na ordem de criação, sem marcação inválida", marked.map(p => p.id).join() === "5,9,12", JSON.stringify(marked));
    check("Nome e descrição vêm do Coordenadas CSV", marked[1].name === "Pilar C8" && marked[1].desc === "topo");
    check("Demais pontos recebem P1, P2…", marked[0].name === "P1" && marked[2].name === "P2", marked.map(p => p.name).join());
    check("Coordenadas em metros", marked[2].x === 10 && marked[2].y === 20 && marked[2].z === 3);
    const noSession = await readMarkedPoints(fakeApi, "outro-projeto");
    check("Sem sessão: P1, P2, P3", noSession.map(p => p.name).join() === "P1,P2,P3");

    // ---------- pontos marcados: desenho no DXF ----------
    const planta = makeSectionPlane([0, 0, 1.5], [0, 0, 1]);
    const mpts = [{ name: "P1", desc: "", x: 734810.41, y: 7527201.64, z: 445.95 }, { name: "P2", desc: "eixo A", x: 1, y: 2, z: 3 }];
    const pl = markedPointLayers(mpts, { plane: planta, scale: 1000 });
    const pointItem = pl.get("PONTOS").find(i => i.point);
    check("Planta: ponto em X, Y × escala", near(pointItem.points[0][0], 734810410, 1e-3) && near(pointItem.points[0][1], 7527201640, 1e-3),
      JSON.stringify(pointItem));
    check("Marca: POINT, círculo, X e nome por ponto", pl.get("PONTOS").length === 10 && pl.get("PONTOS").filter(i => i.circle === 100).length === 2);
    check("Nome com descrição", pl.get("PONTOS").some(i => i.text === "P2 - eixo A" && i.height === 200));
    check("Coordenadas do Trimble em texto", pl.get("PONTOS_COORD")[0].text === "X 734810,410  Y 7527201,640  Z 445,950", pl.get("PONTOS_COORD")[0].text);
    const moved = markedPointLayers([mpts[1]], { plane: planta, scale: 1, toIfc: p => [p[0] - 1, p[1] - 2, p[2]] });
    check("Converte para o espaço do IFC antes de projetar", moved.get("PONTOS")[0].points[0].join() === "0,0", JSON.stringify(moved.get("PONTOS")[0]));
    check("Texto mostra a coordenada do Trimble, não a do desenho", moved.get("PONTOS_COORD")[0].text === "X 1,000  Y 2,000  Z 3,000");
    const corte = makeSectionPlane([0, 0, 0], [0, -1, 0]); // vertical: u = X, v = Z
    const cv = markedPointLayers([{ name: "P1", desc: "", x: 5, y: 7, z: 2 }], { plane: corte, scale: 1 }).get("PONTOS")[0].points[0];
    check("Corte vertical: altura vira o eixo vertical do desenho", near(Math.abs(cv[0]), 5) && near(cv[1], 2), JSON.stringify(cv));
    const dxf = buildDxf(pl, { units: "mm" });
    check("DXF com POINT e CIRCLE na camada PONTOS", /\r\n0\r\nPOINT\r\n8\r\nPONTOS\r\n10\r\n734810410\r\n20\r\n7527201640\r\n/.test(dxf) &&
      /\r\n0\r\nCIRCLE\r\n8\r\nPONTOS\r\n/.test(dxf));
    check("DXF define as camadas PONTOS e PONTOS_COORD em magenta", /LAYER\r\n2\r\nPONTOS\r\n70\r\n0\r\n62\r\n210/.test(dxf) &&
      /LAYER\r\n2\r\nPONTOS_COORD\r\n70\r\n0\r\n62\r\n210/.test(dxf));

    // ---------- interseção de duas linhas ----------
    const P = (x, y, z) => ({ x, y, z });
    let hit = lineIntersection(P(0, 0, 5), P(10, 10, 5), P(0, 10, 5), P(10, 0, 5));
    check("Interseção 3D de diagonais", near(hit.x, 5) && near(hit.y, 5) && near(hit.z, 5) && near(hit.gap, 0, 1e-12) && hit.inside, JSON.stringify(hit));
    hit = lineIntersection(P(0, 0, 0), P(10, 0, 0), P(5, -5, 2), P(5, 5, 2));
    check("Linhas reversas: meio do menor segmento e distância", near(hit.x, 5) && near(hit.y, 0) && near(hit.z, 1) && near(hit.gap, 2), JSON.stringify(hit));
    hit = lineIntersection(P(0, 0, 0), P(10, 0, 0), P(5, -5, 2), P(5, 5, 2), { plan: true });
    check("Em planta: cruza em XY, Z médio e diferença de Z", near(hit.x, 5) && near(hit.y, 0) && near(hit.z, 1) && near(hit.gap, 2), JSON.stringify(hit));
    hit = lineIntersection(P(0, 0, 0), P(10, 0, 10), P(5, -5, 0), P(5, 5, 0), { plan: true });
    check("Em planta: Z de cada linha no cruzamento", near(hit.z, 2.5) && near(hit.gap, 5), JSON.stringify(hit));
    hit = lineIntersection(P(0, 0, 0), P(1, 0, 0), P(5, 1, 0), P(5, 2, 0));
    check("Cruzamento no prolongamento das linhas", near(hit.x, 5) && near(hit.y, 0) && !hit.inside, JSON.stringify(hit));
    hit = lineIntersection(P(734810.41, 7527201.64, 445.95), P(734820.41, 7527211.64, 445.95), P(734810.41, 7527211.64, 445.95), P(734820.41, 7527201.64, 445.95));
    check("Interseção em coordenadas UTM sem perda de precisão", near(hit.x, 734815.41, 1e-6) && near(hit.y, 7527206.64, 1e-6), JSON.stringify(hit));
    const err = fn => { try { fn(); return ""; } catch (e) { return e.message; } };
    check("Linhas paralelas dão erro claro", err(() => lineIntersection(P(0, 0, 0), P(1, 0, 0), P(0, 1, 0), P(1, 1, 0))).includes("paralelas"));
    check("Linha com 2 pontos iguais dá erro", err(() => lineIntersection(P(0, 0, 0), P(0, 0, 0), P(0, 1, 0), P(1, 1, 0))).includes("mesmo lugar"));
    check("Linha vertical não cruza em planta", err(() => lineIntersection(P(0, 0, 0), P(0, 0, 5), P(0, 1, 0), P(1, 1, 0), { plan: true })).includes("vertical"));

    // ---------- coordenadas globais ----------
    const truth = fromBasePoint({ x0: 0, y0: 0, z0: 0, E0: 734000, N0: 7527000, H0: 440, rotationDeg: 30 });
    const g1 = toGlobal(truth, P(100, 0, 5));
    check("Ponto base + rotação anti-horária", near(g1.x, 734000 + 100 * Math.cos(Math.PI / 6), 1e-6) && near(g1.y, 7527000 + 50, 1e-6) && near(g1.z, 445), JSON.stringify(g1));
    const back = toLocal(truth, g1);
    check("Global → local volta ao ponto", near(back.x, 100, 1e-6) && near(back.y, 0, 1e-6) && near(back.z, 5, 1e-9), JSON.stringify(back));
    const offset = fromBasePoint({ x0: 10, y0: 20, z0: 1, E0: 734010, N0: 7527020, H0: 441, rotationDeg: 0 });
    check("Ponto base fora da origem, sem rotação", near(toGlobal(offset, P(0, 0, 0)).x, 734000) && near(toGlobal(offset, P(0, 0, 0)).y, 7527000) && near(toGlobal(offset, P(0, 0, 0)).z, 440));
    const local = [P(0, 0, 0), P(120, 0, 2), P(120, 80, 4), P(0, 80, 6)];
    const control = local.map((p, i) => { const g = toGlobal(truth, p); return { name: `C${i + 1}`, ...p, E: g.x, N: g.y, H: g.z }; });
    let fit = fitControlPoints(control.slice(0, 2));
    check("2 pontos de controle recuperam rotação e deslocamento", near(fit.rotationDeg, 30, 1e-9) && near(fit.scale, 1, 1e-12) && near(fit.tx, truth.tx, 1e-6) &&
      near(fit.ty, truth.ty, 1e-6) && near(fit.dz, 440, 1e-9) && fit.rms < 1e-6, JSON.stringify(fit));
    const noisy = control.map((c, i) => ({ ...c, E: c.E + [0.004, -0.003, 0.002, -0.003][i], N: c.N + [-0.002, 0.003, -0.004, 0.003][i] }));
    fit = fitControlPoints(noisy);
    check("4 pontos com ruído de mm: resíduos pequenos", fit.rms < 0.006 && fit.residuals.length === 4 && near(fit.rotationDeg, 30, 0.01), JSON.stringify({ rms: fit.rms, rot: fit.rotationDeg }));
    const scaled = control.map(c => ({ ...c, E: 734000 + (c.E - 734000) * 0.9996, N: 7527000 + (c.N - 7527000) * 0.9996 }));
    fit = fitControlPoints(scaled, { freeScale: true });
    check("Escala calculada (fator UTM 0,9996)", near(fit.scale, 0.9996, 1e-9) && fit.rms < 1e-6, JSON.stringify({ s: fit.scale, rms: fit.rms }));
    fit = fitControlPoints(scaled);
    check("Escala fixa em 1 mostra o resíduo da diferença de escala", near(fit.scale, 1, 1e-12) && fit.rms > 0.01, JSON.stringify({ rms: fit.rms }));
    fit = fitControlPoints(control.slice(0, 2).map(c => ({ ...c, H: NaN })));
    check("Sem cota nos pontos de controle: Cota = Z", near(fit.dz, 0) && !fit.heightFromControl);
    check("1 ponto de controle não basta", err(() => fitControlPoints(control.slice(0, 1))).includes("2 pontos"));
    check("Pontos de controle no mesmo lugar dão erro", err(() => fitControlPoints([control[0], { ...control[0], name: "C9" }])).includes("próximos"));
    check("Rotação negativa (sentido horário)", near(fromBasePoint({ E0: 0, N0: 0, H0: 0, rotationDeg: -90 }).b, -1));
    check("Detecção: UTM parece global", looksGlobal(P(734810.41, 7527201.64, 0)) && looksGlobal(P(166021, 9000, 0)) === false);
    check("Detecção: perto da origem parece local", !looksGlobal(P(12.5, 340.2, 0)) && !looksGlobal(P(1500, 2500, 0)));

    // ---------- CSV com coordenadas globais ----------
    const withG = [{ name: "P1", x: 1, y: 2, z: 3, desc: "", g: { x: 734001.5, y: 7527002.25, z: 443 } }];
    const both = buildCsv(withG).replace(/^﻿/, "").trim().split("\r\n");
    check("CSV só do modelo continua igual", both[0] === "Ponto;X (m);Y (m);Z (m);Descrição");
    const bothCsv = buildCsv(withG, { coords: "both" });
    const bothLines = bothCsv.replace(/^﻿/, "").trim().split("\r\n");
    check("CSV com as duas coordenadas", bothLines[0] === "Ponto;X (m);Y (m);Z (m);E (m);N (m);Cota (m);Descrição" &&
      bothLines[1] === "P1;1,000;2,000;3,000;734001,500;7527002,250;443,000;", bothLines.join(" | "));
    const onlyG = buildCsv(withG, { coords: "global", format: "intl" }).trim().split("\r\n");
    check("CSV só global", onlyG[0] === "Ponto,E (m),N (m),Cota (m),Descrição" && onlyG[1] === "P1,734001.500,7527002.250,443.000,", onlyG.join(" | "));
    check("CSV global sem conversão dá erro", err(() => buildCsv([{ ...withG[0], g: null }], { coords: "global" })).includes("configure"));
    const reread = parseCsv(bothCsv).points[0];
    check("Importar CSV com as duas: X, Y, Z do modelo e E, N, Cota em g", reread.x === 1 && reread.z === 3 && reread.g?.x === 734001.5 && reread.g?.z === 443, JSON.stringify(reread));
    const onlyGRead = parseCsv(onlyG.join("\n")).points[0];
    check("Importar CSV só global: E, N, Cota viram as coordenadas lidas", onlyGRead.x === 734001.5 && !onlyGRead.g, JSON.stringify(onlyGRead));

    // ---------- saída ----------
    const out = document.getElementById("out");
    for (const r of results) {
      const li = document.createElement("li");
      li.className = r.ok ? "ok" : "falha";
      li.textContent = `${r.ok ? "OK" : "FALHA"} — ${r.nome}${r.ok || !r.detalhe ? "" : " · " + r.detalhe}`;
      out.append(li);
    }
    const falhas = results.filter(r => !r.ok).length;
    document.getElementById("resumo").textContent = `${results.length - falhas}/${results.length} testes passaram.`;
    document.title = falhas ? `FALHA (${falhas})` : "OK";
  </script>
</body>
</html>
